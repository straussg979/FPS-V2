# docker compose up -d            - the game on http://127.0.0.1:5000/
# docker compose --profile tunnel up -d  - plus a Cloudflare Tunnel (TUNNEL_TOKEN in .env)
services:
  game:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - game-data:/app/user
    stop_grace_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["tunnel"]
    # shares the game container's network, so the tunnel reaches it at http://127.0.0.1:5000 and the
    # server trusts its CF-Connecting-IP header (TRUSTED_PROXY=cloudflare)
    network_mode: "service:game"
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - game

volumes:
  game-data:
